name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tools/explorer -p "test_*.py"
      - run: python -m unittest discover -s tools/replay_analysis -p "test_*.py"
      - run: node --check tools/explorer/app.js
      - run: node tools/explorer/test_scenario.cjs
      - run: node tools/explorer/test_results.cjs
      - run: node tools/explorer/test_entry_rank.cjs
      - name: Verify replay data is untracked
        run: python -c "import subprocess; paths = subprocess.check_output(['git', 'ls-files']).decode().splitlines(); assert not any(p.startswith('replays/') or p.lower().endswith('.wotreplay') or p.lower().endswith('replaycache.db') for p in paths)"
